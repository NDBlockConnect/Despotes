tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    archiveVersion = mod_version + '-native-1.20.1'
        manifest {
        attributes([
            'Premain-Class'       : 'dev.despotes.vanilla.DespotesAgent',
            'Agent-Class'         : 'dev.despotes.vanilla.DespotesAgent',
            'Can-Retransform-Classes' : 'true',
            'Specification-Title' : mod_id,
            'Implementation-Version' : mod_semver
        ])
    }
    // v26.2-Alpha.3: embed ASM classes so the agent jar is self-contained.
    from {
        configurations.runtimeClasspath.filter { it.name.startsWith('asm') }.collect {
            zipTree(it).matching { exclude 'META-INF/**' }
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
