buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
    dependencies {
        classpath 'net.fabricmc:tiny-remapper:0.12.3'
        classpath 'net.fabricmc:mapping-io:0.7.1'
        classpath files(
                'C:/Users/Sails/AppData/Local/mdl/libraries/org/ow2/asm/asm/9.10.1/asm-9.10.1.jar',
                'C:/Users/Sails/AppData/Local/mdl/libraries/org/ow2/asm/asm-analysis/9.10.1/asm-analysis-9.10.1.jar',
                'C:/Users/Sails/AppData/Local/mdl/libraries/org/ow2/asm/asm-commons/9.10.1/asm-commons-9.10.1.jar',
                'C:/Users/Sails/AppData/Local/mdl/libraries/org/ow2/asm/asm-tree/9.10.1/asm-tree-9.10.1.jar')
    }
}

plugins {
    id 'java-library'
}

version = mod_version + '-native-1.20.1'
group = mod_group_id

base {
    archivesName = 'Despotes'
}

// Compiled with the daemon JDK's javac at --release 17; no separate toolchain fork
// (a forked JDK 17 compiler daemon dies on this memory-constrained host).

// Official-named 1.20.1 client jar produced by the Fabric Loom cache.
def mcClient = file("C:/Users/Sails/Documents/Workspace/01-Active/Domain-Projects/Minecraft/Despotes/fabric-1.20.1/.gradle/loom-cache/minecraftMaven/net/minecraft/minecraft-merged-b7a764897f/1.20.1-loom.mappings.1_20_1.layered+hash.2198-v2/minecraft-merged-b7a764897f-1.20.1-loom.mappings.1_20_1.layered+hash.2198-v2.jar")
def runtimeMappings = file("C:/Users/Sails/Documents/Workspace/01-Active/Domain-Projects/Minecraft/Despotes/fabric-1.20.1/.gradle/loom-cache/source_mappings/b7a764897fc51a213260536f455b3ec626f2d83c.tiny")
def asmDir = file("C:/Users/Sails/AppData/Local/mdl/libraries/org/ow2/asm")

dependencies {
    compileOnly files(mcClient)
    compileOnly fileTree(dir: "C:/Users/Sails/AppData/Local/mdl/libraries", include: "**/*.jar")
    compileOnly "com.google.code.gson:gson:2.11.0"
    compileOnly "org.jetbrains:annotations:24.0.1"
    compileOnly "org.lwjgl:lwjgl-glfw:3.3.3"
    compileOnly fileTree(dir: "C:/Users/Sails/Documents/Workspace/01-Active/Domain-Projects/Minecraft/Despotes/fabric-1.20.1/.gradle/loom-cache/remapped_mods/loom_mappings_1_20_1_layered_hash_2198_v2", include: "**/*.jar")
    // v26.2-Alpha.3: ASM for dynamic instrumentation, embedded into the agent jar.
    implementation files(
            file("$asmDir/asm/9.10.1/asm-9.10.1.jar"),
            file("$asmDir/asm-tree/9.10.1/asm-tree-9.10.1.jar"),
            file("$asmDir/asm-commons/9.10.1/asm-commons-9.10.1.jar"))
}
//GitHub@NDBlockConnect | BlockConnect@StarsailsClover

sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')
            srcDir file('src/main/java')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    // Keep the named jar for debugging; runtimeRemapJar emits the launchable vanilla jar.
    archiveClassifier = 'named'
    archiveVersion = mod_version + '-native-1.20.1'
        manifest {
        attributes([
            'Premain-Class'       : 'dev.despotes.vanilla.DespotesAgent',
            'Agent-Class'         : 'dev.despotes.vanilla.DespotesAgent',
            'Can-Retransform-Classes' : 'true',
            'Specification-Title' : mod_id,
            'Implementation-Version' : mod_semver
        ])
    }
    // v26.2-Alpha.3: embed ASM classes so the agent jar is self-contained.
    from {
        configurations.runtimeClasspath.filter { it.name.startsWith('asm') }.collect {
            zipTree(it).matching { exclude 'META-INF/**' }
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

/**
 * Minecraft 1.20.1 vanilla uses the obfuscated Mojang runtime namespace. Remap every
 * direct Minecraft reference in the agent from Loom's named namespace to `official`
 * before publishing. Transformer class/method target strings are already official keys.
 */
tasks.register('runtimeRemapJar') {
    dependsOn jar
    def output = layout.buildDirectory.file("libs/Despotes-${mod_version}-native-1.20.1.jar")
    outputs.file(output)
    doLast {
//GitHub@NDBlockConnect | BlockConnect@StarsailsClover
        if (!runtimeMappings.exists()) {
            throw new GradleException("Missing 1.20.1 named->official mappings: ${runtimeMappings}")
        }
        def remapper = net.fabricmc.tinyremapper.TinyRemapper.newRemapper()
                .withMappings(net.fabricmc.tinyremapper.TinyUtils.createTinyMappingProvider(runtimeMappings.toPath(), 'named', 'official'))
                .renameInvalidLocals(true)
                .build()
        def out = new net.fabricmc.tinyremapper.OutputConsumerPath(output.get().asFile.toPath())
        try {
            out.addNonClassFiles(jar.archiveFile.get().asFile.toPath())
            remapper.readClassPath(mcClient.toPath())
            remapper.readInputs(jar.archiveFile.get().asFile.toPath())
            remapper.apply(out)
        } finally {
            out.close()
            remapper.finish()
        }
    }
}

build.dependsOn runtimeRemapJar
