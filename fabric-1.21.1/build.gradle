plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = mod_version + '-fabric-1.21.1'
group = maven_group

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "com.google.code.gson:gson:2.11.0"
    compileOnly "org.jetbrains:annotations:24.0.1"
}

sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Private Minecraft members are reached via MinecraftKeyAccess reflection (no access
// widener), keeping the intermediary-mapped artifact loadable across namespaces.

processResources {
    inputs.property 'version', mod_semver
    filesMatching('fabric.mod.json') {
        expand version: mod_semver
    }
}

jar {
    archiveBaseName = 'Despotes'
    archiveVersion = mod_version + '-fabric-1.21.1'
}
