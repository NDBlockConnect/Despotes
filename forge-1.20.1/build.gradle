buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.30', changing: true
    }
}

apply plugin: 'java-library'
apply plugin: 'net.minecraftforge.gradle'

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
}

version = mod_version + '-forge-1.20.1'
group = mod_group_id

base {
    archivesName = 'Despotes'
}

// Build with the JDK 17 that runs Gradle (no toolchain provisioning).

minecraft {
    mappings channel: 'official', version: "${mc_version}"
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
    compileOnly "com.google.code.gson:gson:2.11.0"
}

sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')
            srcDir file('src/main/java')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', mod_semver
    filesMatching('META-INF/mods.toml') {
        expand version: mod_semver
    }
}

jar {
    archiveVersion = mod_version + '-forge-1.20.1'
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_semver
        ])
    }
}
