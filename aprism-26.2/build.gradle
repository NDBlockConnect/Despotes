plugins {
    id 'java-library'
    id 'java'
}

version = mod_version + '-aprism-26.2'
group = mod_group_id

base {
    archivesName = 'Despotes'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

def mcClient = file("${System.getenv('LOCALAPPDATA')}/mdl/versions/26.2/26.2.jar")
def aprismApi = file("${System.getenv('APPDATA')}/mdl/aprism/Aprism-v26.4-JE-26.2.jar")

dependencies {
    compileOnly files(mcClient)
    compileOnly files(aprismApi)
    compileOnly fileTree(dir: "${System.getenv('LOCALAPPDATA')}/mdl/libraries", include: "**/*.jar")
    compileOnly "com.google.code.gson:gson:2.11.0"
}

sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')
            srcDir file('src/main/java')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Pack the .aje: manifest at the zip root plus the compiled mod jar (Aprism doc 7 layout).
// v26.11: the embedded jar carries a populated MANIFEST.MF (Implementation-*) so tooling
// that reads jar metadata (or tries -javaagent) sees real coordinates, not an empty file.
// Gradle 9 removed project.manifest(Closure), so the manifest is generated as a file.
def ajeManifestFile = layout.buildDirectory.file('aje-manifest/MANIFEST.MF')
def generateAjeManifest = tasks.register('generateAjeManifest') {
//GitHub@NDBlockConnect | BlockConnect@StarsailsClover
    outputs.file(ajeManifestFile)
    doLast {
        def f = ajeManifestFile.get().asFile
        f.parentFile.mkdirs()
        f.text = ("Manifest-Version: 1.0\r\n" +
                "Implementation-Title: Despotes\r\n" +
                "Implementation-Version: ${mod_semver}\r\n" +
                "Implementation-Vendor: NDBlockConnect\r\n" +
                "Specification-Title: Despotes Aprism Native Mod\r\n" +
                "Specification-Version: ${mod_semver}\r\n" +
                "Build-Jdk-Spec: 25\r\n")
    }
}

tasks.register('packageAje', Zip) {
    dependsOn jar
    dependsOn generateAjeManifest
    archiveExtension = 'aje'
    archiveVersion = mod_version + '-aprism-26.2'
    from("src/main/resources") {
        include 'aprism.manifest.json'
        // v26.2-Alpha.5: stamp the manifest version from mod_semver at packaging time.
        expand(aprism_version: mod_semver)
    }
    from(jar.archiveFile) {
        rename { "despotes.jar" }
    }
    from(ajeManifestFile) {
        into 'META-INF'
    }
}

build.dependsOn packageAje

// v26.11 fix: also stamp the standalone jar's manifest (the artifact historically
// shipped as .jar; an empty MANIFEST.MF confused Aprism tooling that reads it).
jar {
    manifest {
        attributes(
                'Implementation-Title': 'Despotes',
                'Implementation-Version': mod_semver,
                'Implementation-Vendor': 'NDBlockConnect',
                'Specification-Title': 'Despotes Aprism Native Mod',
                'Specification-Version': mod_semver,
                'Build-Jdk-Spec': '25')
    }
//GitHub@NDBlockConnect | BlockConnect@StarsailsClover
}
