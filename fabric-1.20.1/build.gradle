plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = mod_version + '-fabric-1.20.1'
group = maven_group

loom {
    accessWidenerPath = file('../fabric-1.21.1/src/main/resources/despotes.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "com.google.code.gson:gson:2.11.0"
    compileOnly "org.jetbrains:annotations:24.0.1"
}

sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')
            srcDir file('../fabric-1.21.1/src/main/java')
        }
        resources {
            srcDir file('../fabric-1.21.1/src/main/resources')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', mod_semver
    filesMatching('fabric.mod.json') {
        expand version: mod_semver
    }
}

jar {
    archiveBaseName = 'Despotes'
    archiveVersion = mod_version + '-fabric-1.20.1'
}
