plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = mod_version + '-fabric-26.2'
group = maven_group

loom {
    accessWidenerPath = file('src/main/resources/despotes.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(':common')
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "org.jetbrains:annotations:24.0.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    archiveBaseName = 'Despotes'
    archiveVersion = mod_version + '-fabric-26.2'
    // Bundle the loader-agnostic common core classes into the mod jar.
    from project(':common').sourceSets.main.output
}
