plugins {
    id 'java-library'
}

version = mod_version + '-native-1.21.1'
group = mod_group_id

base {
    archivesName = 'Despotes'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

def mcClient = file("C:/Users/Sails/Documents/Workspace/NormalWorkspace/Coding/Minecraft/Despotes/fabric-1.21.1/.gradle/loom-cache/minecraftMaven/net/minecraft/minecraft-merged-3904b5154f/1.21.1-loom.mappings.1_21_1.layered+hash.2198-v2/minecraft-merged-3904b5154f-1.21.1-loom.mappings.1_21_1.layered+hash.2198-v2.jar")
def mcServer = file("C:/Users/Sails/AppData/Local/mdl/versions/1.21.1/1.21.1.jar").toPath().resolveSibling("server.jar").toFile()

dependencies {
    compileOnly files(mcClient, mcServer)
    compileOnly "com.google.code.gson:gson:2.11.0"
    compileOnly "org.jetbrains:annotations:24.0.1"
    compileOnly "org.jspecify:jspecify:1.0.0"
    compileOnly "it.unimi.dsi:fastutil:8.5.12"
    compileOnly "com.mojang:brigadier:1.3.10"
    compileOnly "com.mojang:datafixerupper:8.0.16"
    compileOnly "org.jetbrains:annotations:24.0.1"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')
            srcDir file('src/main/java')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    archiveVersion = mod_version + '-native-1.21.1'
    manifest {
        attributes([
            'Premain-Class'       : 'dev.despotes.vanilla.DespotesAgent',
            'Agent-Class'         : 'dev.despotes.vanilla.DespotesAgent',
            'Specification-Title' : mod_id,
            'Implementation-Version' : mod_semver
        ])
    }
}
