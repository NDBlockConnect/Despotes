plugins {
    id 'java-library'
}

version = mod_version + '-native-26.2'
group = mod_group_id

base {
    archivesName = 'Despotes'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// Compile against the official-named vanilla 26.2 client jar (Mojang unobfuscated from
// 26.1 onward). Gson ships with the Minecraft client, so it is compileOnly here too.
def mcClient = file("C:/Users/Sails/AppData/Local/mdl/versions/26.2/26.2.jar")
def mcServer = file("C:/Users/Sails/AppData/Local/mdl/versions/26.2/26.2.jar").toPath().resolveSibling("server.jar").toFile()

dependencies {
    compileOnly files(mcClient, mcServer)
    // Full vanilla dependency set (fastutil/guava/joml/slf4j/...): javac must resolve every
    // type referenced by MC signatures.
    compileOnly "com.google.code.gson:gson:2.11.0"
    compileOnly "org.jetbrains:annotations:24.0.1"
    compileOnly "org.jspecify:jspecify:1.0.0"
    compileOnly "it.unimi.dsi:fastutil:8.5.15"
    compileOnly "com.mojang:brigadier:1.3.10"
    compileOnly "com.mojang:datafixerupper:8.0.16"
}

sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')
            srcDir file('src/main/java')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    archiveVersion = mod_version + '-native-26.2'
    manifest {
        attributes([
            'Premain-Class'       : 'dev.despotes.vanilla.DespotesAgent',
            'Agent-Class'         : 'dev.despotes.vanilla.DespotesAgent',
            'Can-Retransform-Classes' : 'false',
            'Specification-Title' : mod_id,
            'Implementation-Version' : mod_semver
        ])
    }
}
