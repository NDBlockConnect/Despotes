plugins {
    id 'java-library'
}

version = mod_version + '-native-1.21.10'
group = mod_group_id

base {
    archivesName = 'Despotes'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

def root = file('..')
def mcClient = file("${root}/fabric-1.21.10/.gradle/loom-cache/minecraftMaven/net/minecraft/minecraft-merged-6227aad8ee/1.21.10-loom.mappings.1_21_10.layered+hash.2198-v2/minecraft-merged-6227aad8ee-1.21.10-loom.mappings.1_21_10.layered+hash.2198-v2.jar")
def asmDir = file("${System.getenv('LOCALAPPDATA')}/mdl/libraries/org/ow2/asm")

dependencies {
    compileOnly files(mcClient)
    compileOnly fileTree(dir: "${root}/fabric-1.21.10/.gradle/loom-cache/remapped_mods", include: "**/*.jar")
    compileOnly "com.mojang:datafixerupper:8.0.16"
    compileOnly "com.mojang:brigadier:1.3.10"
    compileOnly "it.unimi.dsi:fastutil:8.5.12"
    compileOnly "com.google.code.gson:gson:2.11.0"
    compileOnly "org.jetbrains:annotations:24.0.1"
    compileOnly "org.lwjgl:lwjgl-glfw:3.3.3"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    // v26.2-Alpha.3: ASM for dynamic instrumentation, embedded into the agent jar.
    implementation files(
            file("$asmDir/asm/9.9/asm-9.9.jar"),
            file("$asmDir/asm-tree/9.9/asm-tree-9.9.jar"),
            file("$asmDir/asm-commons/9.9/asm-commons-9.9.jar"))
}

sourceSets {
    main {
        java {
            srcDir file('../common/src/main/java')
            srcDir file('src/main/java')
        }
    }
}

//GitHub@NDBlockConnect | BlockConnect@StarsailsClover
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    archiveVersion = mod_version + '-native-1.21.10'
        manifest {
        attributes([
            'Premain-Class'       : 'dev.despotes.vanilla.DespotesAgent',
            'Agent-Class'         : 'dev.despotes.vanilla.DespotesAgent',
            'Can-Retransform-Classes' : 'true',
            'Specification-Title' : mod_id,
            'Implementation-Version' : mod_semver
        ])
    }
    // v26.2-Alpha.3: embed ASM classes so the agent jar is self-contained.
    from {
        configurations.runtimeClasspath.filter { it.name.startsWith('asm') }.collect {
            zipTree(it).matching { exclude 'META-INF/**' }
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
